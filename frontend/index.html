<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Hub - إدارة الخوادم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root">
    <div id="loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;color:#8b949e;flex-direction:column;gap:1rem;background:#0d1117">
      <p>جاري التحميل...</p>
      <noscript>يُرجى تفعيل JavaScript</noscript>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    setTimeout(function(){
      var loading=document.getElementById('loading');
      if(loading&&loading.parentElement&&loading.parentElement.children.length===1){
        loading.innerHTML='<p style="color:#f85149">فشل تحميل التطبيق. تحقق من الاتصال أو أعد تحميل الصفحة.</p><button onclick="location.reload()" style="padding:8px 16px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer">إعادة المحاولة</button>';
      }
    },5000);
  </script>
</body>
</html>
